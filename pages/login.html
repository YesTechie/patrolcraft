<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#eff2ef">
  <title>YesTechie LABS — PatrolCraft</title>
  <!-- YesTechie Labs Style — VoIP sandbox + Kiosk login, not Bridge Analyzer -->
  <link rel="stylesheet" href="/kit/css/yestechie-appliance.css">
</head>
<body class="page-login" data-page="login">
  <div class="ambient-scanner-h"></div>
  <div class="ambient-scanner-v"></div>

  <div class="login-container">
    <div class="panel-corner"></div>
    <div class="header-block">
      <h1 class="main-title" id="title" data-value="PatrolCraft">PatrolCraft</h1>
      <p class="subtitle" id="subtitle"></p>
    </div>

    <div class="error-box" id="error"></div>

    <div class="form-group">
      <label class="form-label">Username</label>
      <input type="text" class="form-control" id="username" autocomplete="username" autofocus>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" id="password" autocomplete="current-password">
    </div>

    <button class="btn-submit" id="submit-btn" type="button">
      <span class="btn-text">Sign In</span>
    </button>
    <p class="login-version" id="appVersion"></p>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>

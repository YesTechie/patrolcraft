<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#eef2ef">
  <title>PatrolCraft</title>
  <!-- YesTechie Labs Style — sidebar // Nav shell, not Bridge Analyzer -->
  <link rel="stylesheet" href="/kit/css/yestechie-appliance.css">
  <link rel="stylesheet" href="/css/patrolcraft.css">
</head>
<body data-page="app">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="layout">
    <header class="mobile-top">
      <button type="button" class="menu-btn" id="menuBtn" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div>
        <div class="mobile-brand">PatrolCraft</div>
        <div class="mobile-site" id="siteNameMobile">YesTechie Labs</div>
      </div>
    </header>

    <div class="sidebar">
      <div class="logo">
        <h1>PatrolCraft</h1>
        <p id="siteName">YesTechie Labs</p>
      </div>
      <a class="nav-item active" data-nav="patrols" href="#/patrols">// Patrols</a>
      <a class="nav-item" data-nav="config" href="#/config">// Config</a>
      <a class="nav-item" data-nav="logs" href="#/logs">// Logs</a>
      <div class="sidebar-footer">
        <div class="app-ver" id="appVersion"></div>
        <div class="data-row">
          <span>Protect</span>
          <span class="data-value" id="protectStatus"><span class="dot"></span> —</span>
        </div>
        <a href="/logout">// Sign Out</a>
      </div>
    </div>

    <div class="main">
      <div class="section active" id="sec-patrols"></div>
      <div class="section" id="sec-config"></div>
      <div class="section" id="sec-logs"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/js/app.js"></script>
</body>
</html>
